[package]
name = "laf-shell"
version = "0.3.0"
description = "Local AI Video Factory desktop shell (Tauri 2)"
authors = ["rajbh"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
# Job Object kill-on-close: the backend must never outlive the shell
# (Phase 3 orphan fix). windows-sys is already in the dependency tree
# via Tauri, so this adds no new third-party crate.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
